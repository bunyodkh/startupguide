{% extends "base.html" %}
{% load i18n %}

{% block content %}

    <div class="layout-block span-col-2">

        <h1 class="meduim-bold error-page-title">{% trans "Page not found" %}</h1>

    </div>

    <div class="span-col-1"></div>

  </div>

{% endblock %}
