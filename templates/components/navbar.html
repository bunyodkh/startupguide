{% load i18n %}
{% load static %}

<nav class="container navbar">
    <div class="logo">
        <h1 class="extra-bold"><a class="neon-split" data-text="Startup Guide" href="{% url 'hub:index' %}">Startup Guide</a></h1>
    </div>

    <div></div>

    <div class="nav-cta">

        <!-- Language dropdown -->
        <div class="nav-user-wrap">
            <button class="nav-lang-btn" id="navLangBtn" type="button">
                {{ LANGUAGE_CODE|upper }} <span class="nav-lang-chevron">▾</span>
            </button>
            <div class="nav-dropdown" id="navLangDropdown">
                <a href="/en{{ request.path|slice:'3:' }}" class="nav-dropdown-item{% if LANGUAGE_CODE == 'en' %} nav-dropdown-item--active{% endif %}">English</a>
                <a href="/ru{{ request.path|slice:'3:' }}" class="nav-dropdown-item{% if LANGUAGE_CODE == 'ru' %} nav-dropdown-item--active{% endif %}">Русский</a>
                <a href="/uz{{ request.path|slice:'3:' }}" class="nav-dropdown-item{% if LANGUAGE_CODE == 'uz' %} nav-dropdown-item--active{% endif %}">O'zbek</a>
            </div>
        </div>

        {% if user.is_authenticated %}
            <div class="nav-user-wrap">
                <button class="nav-user" id="navUserBtn" type="button">
                    <span>{% trans "Hi" %}, {{ user.first_name|default:user.email }}</span>
                    <div class="nav-avatar-container">
                        <img src="{{ user.builder_profile.get_thumbnail_url }}" alt="{{ user.first_name }}" width="30" height="30">
                    </div>
                </button>
                <div class="nav-dropdown" id="navDropdown">
                    <a href="{% url 'users:manage_profile' %}" class="nav-dropdown-item">{% trans "Profile" %}</a>
                    <form method="post" action="{% url 'account_signout' %}">
                        {% csrf_token %}
                        <button type="submit" class="nav-dropdown-item">{% trans "Sign out" %}</button>
                    </form>
                </div>
            </div>
        {% else %}
            <a href="{% url 'account_login' %}" class="cta">{% trans "Start here" %}</a>
        {% endif %}

    </div>
</nav>

<div class="line"></div>

<script>
    function initDropdown(btnId, dropdownId) {
        const btn = document.getElementById(btnId);
        const dropdown = document.getElementById(dropdownId);
        if (!btn) return;
        btn.addEventListener('click', function (e) {
            e.stopPropagation();
            const isOpen = dropdown.classList.contains('open');
            document.querySelectorAll('.nav-dropdown').forEach(function (d) { d.classList.remove('open'); });
            if (!isOpen) dropdown.classList.add('open');
        });
    }
    initDropdown('navLangBtn', 'navLangDropdown');
    initDropdown('navUserBtn', 'navDropdown');
    document.addEventListener('click', function () {
        document.querySelectorAll('.nav-dropdown').forEach(function (d) { d.classList.remove('open'); });
    });
</script>
